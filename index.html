<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0e1116" />
    <title>Grand Property Auto</title>
    <!-- the boot splash paints before any stylesheet or script has loaded -->
    <style>
      html, body { margin: 0; height: 100%; background: #0e1116; }
      #boot { position: fixed; inset: 0; z-index: 40; display: grid; place-content: center; justify-items: center; gap: 14px; background: radial-gradient(ellipse at 50% 42%, #1a202b, #090b0f); color: #fffaf0; font: 600 13px 'Segoe UI', system-ui, sans-serif; transition: opacity 0.32s ease-out; }
      #boot.out { opacity: 0; pointer-events: none; }
      #boot .bm { display: grid; gap: 5px; padding: 12px 14px; border-radius: 12px; background: #ffc940; border: 3px solid #14181f; transform: rotate(-4deg) skewX(-6deg); box-shadow: 0 6px 0 rgba(0, 0, 0, 0.35); }
      #boot .bm i { display: block; width: 34px; height: 7px; border-radius: 4px; background: #14181f; transform-origin: left; animation: bootm 1.1s ease-in-out infinite; }
      #boot .bm i:nth-child(2) { animation-delay: 0.14s; }
      #boot .bm i:nth-child(3) { animation-delay: 0.28s; }
      @keyframes bootm { 0%, 100% { transform: scaleX(1); } 50% { transform: scaleX(0.45); } }
      #boot b { font: 30px/1 Impact, 'Arial Black', sans-serif; letter-spacing: 0.03em; }
      #boot span { letter-spacing: 0.04em; opacity: 0.66; }
      @media (prefers-reduced-motion: reduce) { #boot .bm i { animation: none; } }
    </style>
    <link rel="stylesheet" href="/src/style.css" />
    <link rel="stylesheet" href="/src/hud.css" />
    <link rel="stylesheet" href="/src/tour.css" />
    <link rel="stylesheet" href="/src/screens.css" />
    <link rel="stylesheet" href="/src/ui.css" />
    <link rel="stylesheet" href="/src/maya.css" />
    <link rel="stylesheet" href="/src/clients.css" />
    <link rel="stylesheet" href="/src/buyer.css" />
    <link rel="stylesheet" href="/src/polish.css" />
    <link rel="stylesheet" href="/src/finish.css" />
  </head>
  <body>
    <div id="boot" role="status" aria-label="Loading Grand Property Auto"><div class="bm"><i></i><i></i><i></i></div><b>GRAND PROPERTY AUTO</b><span>Building the neighborhood</span></div>
    <div id="app"></div>
    <div id="hud"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
